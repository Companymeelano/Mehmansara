<?xml version="1.0" encoding="UTF-8"?>
<!-- Creator badge master: a laurel-framed medal carrying the 3D "MY" monogram.
     In-app, the name is rendered as a metallic 3D extrusion (CreatorSignature.kt). -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <defs>
    <radialGradient id="disc" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#F7ECD2"/><stop offset="0.55" stop-color="#C8A96A"/><stop offset="1" stop-color="#6E5426"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFD9A7"/><stop offset="1" stop-color="#93763F"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="42" fill="url(#rim)"/>
  <circle cx="48" cy="48" r="36" fill="url(#disc)"/>
  <text x="48" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="30" fill="#5C4718">MY</text>
  <path d="M20,66 Q10,48 20,30 M76,66 Q86,48 76,30" fill="none" stroke="url(#rim)" stroke-width="3" stroke-linecap="round"/>
</svg>
