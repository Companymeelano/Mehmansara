name: Windows CI

on:
  push:
    branches: [ "**" ]
    paths:
      - "desktop/**"
      - ".github/workflows/windows-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Publish Mehra.exe (win-x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup -y

      - name: Publish single-file self-contained exe
        shell: pwsh
        run: |
          dotnet publish desktop/Mehra.Desktop/Mehra.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:UseAppHost=true -o desktop/publish 2>&1 | Tee-Object -FilePath build.log
          if (-not (Test-Path desktop\publish\Mehra.exe)) { throw "Mehra.exe was not produced" }
          (Get-Item desktop\publish\Mehra.exe).Length

      - name: Download SQL Server 2016 LocalDB + OLE DB Driver 19 MSIs (bundled into the setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path desktop\Setup\redist | Out-Null
          $url = 'https://download.microsoft.com/download/9/0/7/907AD35F-9F9C-43A5-9789-52470555DB90/ENU/SqlLocalDB.msi'  # SQL Server 2016 x64 LocalDB (~45 MB, lighter than 2022's 53 MB)
          $out = 'desktop\Setup\redist\SqlLocalDB.msi'
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          $f = Get-Item $out
          if ($f.Length -lt 10MB) { throw "SqlLocalDB.msi looks truncated: $($f.Length) bytes" }
          $hash = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          Write-Host "SqlLocalDB.msi bytes=$($f.Length) sha256=$hash"
          "$hash  SqlLocalDB.msi" | Out-File -FilePath setup-localdb-sha256.txt -Encoding utf8
          # OLE DB driver 19.3.5 x64 (MSOLEDBSQL19) — guarantees table creation on any 64-bit Windows
          # OLE DB Driver 19.4.1 x64 en-US (ProgID MSOLEDBSQL19); fallback: 18.7.6 x64 (ProgID MSOLEDBSQL)
          $url2 = 'https://download.microsoft.com/download/b5865bb8-7bc6-4068-9c1d-fb77c256a865/amd64/1033/msoledbsql.msi'
          $url2b = 'https://download.microsoft.com/download/1bf0a51f-dd1e-4cd6-98fb-22f5ea9ce0b2/amd64/1033/msoledbsql.msi'
          $out2 = 'desktop\Setup\redist\msoledbsql.msi'
          try { Invoke-WebRequest -Uri $url2 -OutFile $out2 -UseBasicParsing } catch { Write-Host "primary oledb url failed, trying 18.7.6: $_"; Invoke-WebRequest -Uri $url2b -OutFile $out2 -UseBasicParsing }
          $f2 = Get-Item $out2
          if ($f2.Length -lt 5MB) { throw "msoledbsql.msi looks truncated: $($f2.Length) bytes" }
          $hash2 = (Get-FileHash $out2 -Algorithm SHA256).Hash.ToLower()
          Write-Host "msoledbsql.msi bytes=$($f2.Length) sha256=$hash2"
          "$hash2  msoledbsql.msi" | Out-File -FilePath setup-oledb-sha256.txt -Encoding utf8

      - name: Build MehraSetup.exe with Inno Setup (ISCC)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          & $iscc "desktop\Setup\setup.iss" 2>&1 | Tee-Object -FilePath setup-build.log
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path setup-out\MehraSetup.exe)) { throw "MehraSetup.exe was not produced" }
          (Get-Item setup-out\MehraSetup.exe).Length

      - name: Package exe + zip + log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out\exe, out\logs, out\setup | Out-Null
          Copy-Item desktop\publish\Mehra.exe out\exe\Mehra.exe
          [System.IO.File]::WriteAllText("out\exe\README.txt", $env:MEHRA_README, [System.Text.Encoding]::UTF8)
          Compress-Archive -Path out\exe\Mehra.exe, out\exe\README.txt -DestinationPath out\exe\Mehra-win-x64.zip -Force
          Copy-Item build.log out\logs\windows-build.log
          Copy-Item setup-out\MehraSetup.exe out\setup\MehraSetup.exe
          if (Test-Path setup-build.log) { Copy-Item setup-build.log out\setup\setup-build.log } else { 'no setup-build.log' | Out-File out\setup\setup-build.log }
          Get-ChildItem out -Recurse | Select-Object FullName, Length
        env:
          MEHRA_README: |-
            مهرآ — نسخٔ ویندوز (Mehra.exe)
            سامانهٔ مدیریت مهمان‌پذیر فرهنگان اهواز — نسخٔ ۱.۱.۳
            
            1. فایل Mehra.exe را اجرا کنید (win-x64، self-contained — نیازی به نصب .NET نیست).
            2. «ورود نمایشی»: بدون سرور — با دادهٔ نمونه کامل.
            3. «ورود با SQL Server»: اتصال مستقیم به Microsoft SQL Server — با نصب‌گر MehraSetup.exe، SQL Server LocalDB 2016 (سبک‌تر، ~۴۵ مگابایت) به‌صورت خودکار همراه برنامه نصب و پایگاه دادهٔ «Mehra» ساخته می‌شود (پیش‌فرض: (localdb)\MSSQLLocalDB)؛ یا به هر SQL Server موجود (2008 به بالا) متصل شوید — جداول به‌صورت خودکار ساخته می‌شوند.
            4. «ورود با API»: نشانی سرور + نام کاربری/رمز عبور.
            
            صفحه‌ها: خانه / اتاق‌ها / رزروها / پذیرش / مهمانان / مالی / نظافت / تعمیرات / گزارش‌ها / کاربران / اعلان‌ها / تنظیمات
            
            طراح و توسعه‌دهنده: میلاد یعقوبی

      # APKs (android-ci) and the exe (this job) share the ci-artifacts branch:
      # clone the existing branch and merge into it — never force-push.
      - name: Publish exe to ci-artifacts branch (merge)
        if: success()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Merge into existing ci-artifacts in a CLEAN directory (checkout over
          # untracked files fails); keep other jobs' files (apk/) — no force-push.
          Remove-Item -Recurse -Force merge -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path merge | Out-Null
          Set-Location merge
          git init -q
          git config user.name "mehra-ci"
          git config user.email "ci@mehra.local"
          git remote add origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git fetch -q origin ci-artifacts 2>$null
          $fetched = ($LASTEXITCODE -eq 0)
          git show-ref --verify -q refs/remotes/origin/ci-artifacts
          $haveRef = ($LASTEXITCODE -eq 0)
          if ($fetched -and $haveRef) {
            git checkout -q -B ci-artifacts origin/ci-artifacts
            Remove-Item -Recurse -Force setup -ErrorAction SilentlyContinue
            Remove-Item -Force exe\Mehra.exe, exe\README.txt, exe\Mehra-win-x64.zip -ErrorAction SilentlyContinue
          } else {
            git checkout -q -b ci-artifacts
          }
          Copy-Item -Recurse -Force ..\out\* .
          git add -A
          git commit -q -m "MEHRA Windows exe $env:GITHUB_SHA" 2>$null
          git push origin ci-artifacts

      - name: Publish build log on failure
        if: failure()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (Test-Path build.log) { Copy-Item build.log out\last-windows-build.log } else { "publish step did not run" | Out-File out\last-windows-build.log }
          if (Test-Path setup-build.log) { Copy-Item setup-build.log out\setup-build.log }
          Remove-Item -Recurse -Force merge -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path merge | Out-Null
          Set-Location merge
          git init -q
          git config user.name "mehra-ci"
          git config user.email "ci@mehra.local"
          git remote add origin "https://x-access-token:$env:GITHUB_TOKEN@github.com/$env:GITHUB_REPOSITORY.git"
          git fetch -q origin ci-build-log 2>$null
          $fetched = ($LASTEXITCODE -eq 0)
          git show-ref --verify -q refs/remotes/origin/ci-build-log
          $haveRef = ($LASTEXITCODE -eq 0)
          if ($fetched -and $haveRef) {
            git checkout -q -B ci-build-log origin/ci-build-log
          } else {
            git checkout -q -b ci-build-log
          }
          Copy-Item -Recurse -Force ..\out\* .
          git add -A
          git commit -q -m "windows build log $env:GITHUB_SHA" 2>$null
          git push origin ci-build-log
