name: Android CI

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      # GitHub-hosted artifact downloads are not reachable from every environment,
      # so the APK and the compiler output are published on dedicated branches.
      - name: Publish APK to ci-artifacts branch
        if: success()
        run: |
          set -e
          mkdir -p out/apk out/logs
          cp app/build/outputs/apk/debug/*.apk out/apk/ || true
          cp build.log out/logs/ 2>/dev/null || true
          cp test.log out/logs/ 2>/dev/null || true
          cd out
          git init -q
          git config user.name "mehra-ci"
          git config user.email "ci@mehra.local"
          git checkout -q -b ci-artifacts
          git add -A
          git commit -q -m "MEHRA debug APK ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish build log on failure
        if: failure()
        run: |
          set -e
          mkdir -p out
          cp build.log out/last-build.log 2>/dev/null || echo "assemble step did not run" > out/last-build.log
          cp test.log out/last-test.log 2>/dev/null || true
          if [ -d app/build/reports/tests ]; then cp -r app/build/reports/tests out/test-reports; fi
          cd out
          git init -q
          git config user.name "mehra-ci"
          git config user.email "ci@mehra.local"
          git checkout -q -b ci-build-log
          git add -A
          git commit -q -m "build log ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-build-log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mehra-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
