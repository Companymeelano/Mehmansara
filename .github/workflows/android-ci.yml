name: Android CI

on:
  push:
    branches: [ "**" ]
    # Only rebuild APKs when Android sources or this workflow change — docs-only pushes
    # must NOT re-sign (each run uses a fresh ephemeral key, which would change the APK
    # sha256 and invalidate the hashes pinned in artifacts/SHA256SUMS.txt).
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Ephemeral, CI-only signing key so the release APK is installable.
      # keystore.properties is gitignored and never committed; for store
      # publishing, provide your own release keystore instead (docs/INSTALL.md).
      - name: Generate ephemeral release keystore (CI-only)
        run: |
          keytool -genkeypair -v -keystore /tmp/mehra-ci.jks -alias mehra -keyalg RSA -keysize 2048 -validity 10000 -storepass mehra-ci-pass -keypass mehra-ci-pass -dname "CN=Mehra CI, OU=Mehra, O=Meelano, L=Istanbul, ST=Istanbul, C=TR"
          printf 'storeFile=/tmp/mehra-ci.jks\nstorePassword=mehra-ci-pass\nkeyAlias=mehra\nkeyPassword=mehra-ci-pass\n' > keystore.properties

      - name: Unit tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee test.log

      # Single local build since 1.4.0 (no flavours): release (always signed) + debug.
      - name: Assemble APKs
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      # GitHub-hosted artifact downloads are not reachable from every environment,
      # so the APK and the compiler output are published on dedicated branches.
      - name: Publish APK to ci-artifacts branch
        if: success()
        run: |
          set -e
          mkdir -p out/apk out/logs
          # Stable file names so the links in artifacts/README.md never change.
          cp app/build/outputs/apk/release/*.apk out/apk/app-release.apk || true
          cp app/build/outputs/apk/debug/*.apk out/apk/app-debug.apk || true
          cp build.log out/logs/ 2>/dev/null || true
          cp test.log out/logs/ 2>/dev/null || true
          # Merge into the existing ci-artifacts branch in a CLEAN directory
          # (checking out over untracked files fails), so artifacts from other
          # jobs (e.g. exe/ from Windows CI) are preserved — never force-push.
          rm -rf merge && mkdir merge && cd merge
          git init -q
          git config user.name "mehra-ci"
          git config user.email "ci@mehra.local"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-artifacts && git show-ref --verify -q refs/remotes/origin/ci-artifacts; then
            git checkout -q -B ci-artifacts origin/ci-artifacts
            rm -rf apk
          else
            git checkout -q -b ci-artifacts
          fi
          cp -r ../out/apk ../out/logs .
          git add -A
          git commit -q -m "MEHRA debug APK ${GITHUB_SHA}" || true
          git push origin ci-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish build log on failure
        if: failure()
        run: |
          set -e
          mkdir -p out
          cp build.log out/last-build.log 2>/dev/null || echo "assemble step did not run" > out/last-build.log
          cp test.log out/last-test.log 2>/dev/null || true
          if [ -d app/build/reports/tests ]; then cp -r app/build/reports/tests out/test-reports; fi
          rm -rf merge && mkdir merge && cd merge
          git init -q
          git config user.name "mehra-ci"
          git config user.email "ci@mehra.local"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-build-log && git show-ref --verify -q refs/remotes/origin/ci-build-log; then
            git checkout -q -B ci-build-log origin/ci-build-log
          else
            git checkout -q -b ci-build-log
          fi
          cp -r ../out/* .
          git add -A
          git commit -q -m "build log ${GITHUB_SHA}" || true
          git push origin ci-build-log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mehra-debug-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
